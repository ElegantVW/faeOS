[package]
name = "bulwark"
version = "0.1.0"
edition = "2021"
description = "faeOS first-party host protection — zero runtime package deps"
license = "MIT"
publish = false

[[bin]]
name = "bulwark"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
