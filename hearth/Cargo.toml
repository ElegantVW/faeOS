[package]
name = "hearth"
version = "0.1.0"
edition = "2021"
description = "faeOS user manager — multi-user auth and session switching"
license = "MIT"
publish = false

[[bin]]
name = "hearth"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
portable-pty = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
