# ~/.config/starship.toml
# Single-line PS1 only. The pink status box is printed by zsh precmd/tick
# via `starship-box --status` so the line editor never tracks multi-line
# prompt width (which caused ghost/duplicate characters on kmscon).
#
# Custom modules MUST use ${custom.name} braces — bare $custom.name is
# parsed as $custom + literal ".name".

format = "${custom.pixie_cursor}"

right_format = ""
palette = "pink_system"
add_newline = false

[palettes.pink_system]
pink = "#e879a0"
dark_pink = "#c44d7a"
pink_dim = "#9d5c75"
blush = "#f0b4c8"
silver = "#c0c0c8"
silver_dim = "#8a8a96"
danger = "#ff2d55"
warn = "#ffb020"
ok = "#3dd68c"

# Cursor line only (must stay single-line)
[custom.pixie_cursor]
command = "starship-box --cursor"
when = "true"
format = "$output"
shell = ["bash", "--noprofile", "--norc"]
ignore_timeout = true
description = "Single-line summon + > cursor"

# Built-ins unused — rendered inside starship-box --status
[username]
disabled = true

[hostname]
disabled = true

[directory]
disabled = true

[git_branch]
disabled = true

[git_status]
disabled = true

[cmd_duration]
disabled = true

[time]
disabled = true

[memory_usage]
disabled = true

[character]
disabled = true

[line_break]
disabled = true
