backend = "glx"
vsync = true

shadow = true
shadow-radius = 12
shadow-offset-x = -8
shadow-offset-y = -8
shadow-opacity = 0.35
# fae-hud must be here too, not just in rounding-exclude. With a shadow on it
# the compositor drew a blurred dark frame around the switcher, which read as
# the panel being inset ~18px inside its own window: measured, c_void filled
# the window edge to edge while the panel sat 396x126 inside 432x164. The
# window was never the wrong size; the shadow was sitting on top of it.
shadow-exclude = [ "name = 'i3bar'", "name = 'rofi'", "name = 'fae-hud'" ]

corner-radius = 12
round-borders = 12

# fae-hud declares itself _NET_WM_WINDOW_TYPE_DOCK, so picom classified the
# switcher as an INACTIVE window and applied inactive-opacity to it — which is
# why the strip was see-through no matter what alpha cairo filled it with.
# And round-borders was rounding the panel's corners, clipping the ones cairo
# drew and cutting the corner facets. The switcher draws its own corners, so
# it is excluded from both.
inactive-opacity = 1.0
active-opacity = 1.0
rounding-exclude = [ "name = 'fae-hud'" ]
opacity-rule = [ "100:class_g = 'kitty'" ]
# tv-off: window-shader-fg-rule = [ "crt.frag:class_g = 'kitty'" ]
