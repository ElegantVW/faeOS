backend = "glx"
vsync = true

shadow = true
shadow-radius = 12
shadow-offset-x = -8
shadow-offset-y = -8
shadow-opacity = 0.35
shadow-exclude = [ "name = 'i3bar'", "name = 'rofi'" ]

corner-radius = 12
round-borders = 12

inactive-opacity = 0.92
active-opacity = 1.0
opacity-rule = [ "100:class_g = 'kitty'" ]
window-shader-fg-rule = [ "crt.frag:class_g = 'kitty'" ]
