# Pixie pink terminal — kitty 0.48+
# Uses first available family; override if you install a Nerd Font
font_family      DejaVuSansM Nerd Font Mono
bold_font        auto
italic_font      auto
font_size        12.0

# Scroll / window
scrollback_lines 20000
enable_audio_bell no
confirm_os_window_close 0
remember_window_size  yes
initial_window_width  120c
initial_window_height 36c

# Cursor
cursor_shape beam
cursor_blink_interval 0.6
cursor #e879a0
cursor_text_color #1a0a12

# Colors (phosphor pink / dark)
foreground #ff9cc4
background #12080e
selection_foreground #12080e
selection_background #e879a0
url_color #f0b4c8
active_border_color #c44d7a
inactive_border_color #3a2030

# black
color0  #1a0a12
color8  #5a3a48
# red
color1  #ff2d55
color9  #ff6b8a
# green
color2  #3dd68c
color10 #6eecc0
# yellow
color3  #ffb020
color11 #ffd078
# blue
color4  #c44d7a
color12 #e879a0
# magenta
color5  #e879a0
color13 #f0b4c8
# cyan
color6  #9d5c75
color14 #c44d7a
# white
color7  #d8a0c0
color15 #ffe3ee

# Keys: report full keyboard for apps that want it
macos_option_as_alt no
# Fix Shift-Tab for scry widget
map shift+tab send_text all \x1b[Z

# Clipboard
copy_on_select yes
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Tabs
tab_bar_style powerline
active_tab_foreground   #12080e
active_tab_background   #e879a0
inactive_tab_foreground #c0c0c8
inactive_tab_background #2a1520
