### Pixie — system kmscon (no X / no startx)

### Graphics
drm
hwaccel
gpus=all
use-original-mode
multi-monitor=clone

### Fonts (Ctrl++ / Ctrl+- live zoom)
font-engine=pango
font-size=16
font-name=DejaVu Sans Mono, Liberation Mono, FreeMono, monospace

### Terminal
term=xterm-256color
sb-size=20000
no-bell

# Backspace as BS (^H) — DEL mode left fat spaces in zsh on erase
no-backspace-delete

### Input
xkb-layout=us
xkb-model=pc105
mouse
xkb-repeat-delay=200
xkb-repeat-rate=40

### Shortcuts — keysyms are case-sensitive (plus not Plus)
grab-scroll-up=<Shift>Up
grab-scroll-down=<Shift>Down
grab-page-up=<Shift>Prior
grab-page-down=<Shift>Next
grab-zoom-in=<Ctrl>plus
grab-zoom-out=<Ctrl>minus

