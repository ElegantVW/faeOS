[package]
name = "pixie-lock"
version = "0.1.0"
edition = "2021"
description = "faeOS lock screen — elaborate pink-themed locker with idle daemon"
license = "MIT"
publish = false

[[bin]]
name = "pixie-lock"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rusttype = "0.9"
rand = "0.8"
ctrlc = "3.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
