[package]
name = "seal"
version = "0.3.0"
edition = "2021"
description = "faeOS seal — native X11 screen locker with animated UI"
license = "MIT"
publish = false

[[bin]]
name = "seal"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rusttype = "0.9"
rand = "0.8"
libc = "0.2"
x11rb = { version = "0.13", features = ["allow-unsafe-code", "xinput", "randr", "dpms"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
